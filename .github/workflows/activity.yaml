name: activity

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub Actions minimum)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: overview
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh last-activity card
        id: gen
        env:
          GH_TOKEN: ${{ secrets.OVERVIEW_TOKEN != '' && secrets.OVERVIEW_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
          MODE: activity
        run: python .github/scripts/overview.py

      - name: Point the Overview link at the latest activity
        env:
          LAST_URL: ${{ steps.gen.outputs.last_url }}
        run: |
          python - "$LAST_URL" <<'PY'
          import re, sys
          url = sys.argv[1]
          with open("README.md", encoding="utf-8") as f:
              readme = f.read()
          readme = re.sub(
              r"(<!-- last-url:start -->).*?(<!-- last-url:end -->)",
              rf'\1<a href="{url}">'
              r'<picture>'
              r'<source media="(prefers-color-scheme: dark)" srcset="./assets/overview/last_dark.svg">'
              r'<source media="(prefers-color-scheme: light)" srcset="./assets/overview/last_light.svg">'
              r'<img src="./assets/overview/last_light.svg" width="420" alt="Last activity">'
              r'</picture></a>\2',
              readme, flags=re.S)
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)
          PY

      - name: Commit if changed
        run: |
          git config user.name "Sought Xp"
          git config user.email "dev@soughtxp.dev"
          if [ -n "$(git status --porcelain)" ]; then
            git add assets/overview README.md
            CID="I$(head -c 20 /dev/urandom | sha1sum | cut -d' ' -f1)"
            git commit -m "SoughtXp: refresh last activity" -m "Change-Id: $CID"
            git push
          else
            echo "nothing changed"
          fi
